version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-app
    ports:
      - "8080:8080" # Change if your app uses a different port
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      # DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SLACK_API_TOKEN: ${SLACK_API_TOKEN}
    depends_on:
      - postgres
    command: ["./wait-for-it.sh", "postgres:5432", "--", "./app"]
    networks:
      - app-network
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      # POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
